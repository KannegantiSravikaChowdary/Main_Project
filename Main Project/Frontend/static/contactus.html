<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #eaf2f8; /* Light blue background */
      color: #333;
      line-height: 1.6;
    }

    #contact-us {
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: #ffffff; /* White card background */
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15); /* Soft shadow */
    }

    #contact-us h2 {
      text-align: center;
      color: #2c3e50; /* Darker blue */
      margin-bottom: 15px;
    }

    #contact-us p {
      text-align: center;
      margin-bottom: 20px;
      color: #555; /* Subtle text color */
    }

    #contact-us ul {
      list-style-type: none;
      padding: 0;
    }

    #contact-us li {
      margin: 12px 0;
      font-size: 16px;
      color: #444;
    }

    #contact-us a {
      color: #3498db; /* Blue link color */
      text-decoration: none;
    }

    #contact-us a:hover {
      text-decoration: underline;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(120deg, #2c3e50 0%, #2980b9 100%);
      z-index: -1; /* Gradient background */
    }

    .email-icon {
      margin-right: 8px;
    }

    .logo {
      filter: brightness(1.2); /* Makes the logo brighter */
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3); /* Adds subtle glow to the logo */
    }

    @media (max-width: 600px) {
      #contact-us {
        margin: 20px;
        padding: 15px;
      }

      #contact-us h2 {
        font-size: 24px;
      }

      #contact-us li {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <section id="contact-us">
    <h2>Contact Us</h2>

</body>
</html>
