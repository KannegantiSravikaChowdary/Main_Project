<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classify - AeroClassify</title>
    <link rel="stylesheet" href="../static/classify.css">
</head>
<body>
    <!-- Main Classify Section -->
    <section class="classify-section">
        <h2>Classify Radar Data</h2>
        <div class="upload-container">
            <label for="file-upload" class="upload-label">Upload Data</label>
            <input type="file" id="file-upload" accept=".wav, .txt, .csv, .jpg, .png" onchange="handleFileUpload()">
        </div>
        <div id="status-bar" class="status-bar">
            <div id="progress" class="progress"></div>
            <p id="status-text">Awaiting file upload...</p>
        </div>
        <div id="result-container" class="result-container" style="display: none;">
            <h3 id="classification-result">Target: <span id="target-type">---</span></h3>
            <p>Confidence: <span id="confidence-level">--%</span></p>
            <div id="visualization-container">
                <img id="spectrogram-img" src="" alt="Spectrogram Image" style="width: 100%;"/>
            </div>
        </div>
        <div id="download-options" class="download-options" style="display: none;">
            <button onclick="downloadResults('pdf')">Download PDF</button>
            <button onclick="downloadResults('csv')">Download CSV</button>
        </div>
    </section>
    
    <script src="../static/script.js"></script>
</body>
</html>
