<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AeroClassify</title>
    <link rel="stylesheet" href="../static/auth.css">
</head>
<body>
    <!-- Login Form -->
    <main>
        <section class="auth-form">
            <h2>Login</h2>
            <form id="login-form">
                <input type="text" name="username" id="username" placeholder="Username" required>
                <input type="password" name="password" id="password" placeholder="Password" required>
                <button type="button" onclick="login()">Login</button>
                <p>Don't have an account? <a href="/signup">Sign Up</a></p>
            </form>
        </section>
    </main>

    <script>
        function login() {
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    // Retrieve stored credentials from localStorage
    const storedUsername = localStorage.getItem('username');
    const storedPassword = localStorage.getItem('password');

    // Check if the entered username and password match the stored credentials
    if (username === storedUsername && password === storedPassword) {
        // Redirect to classify.html on successful login
        window.location.href = "classify.html";  // Or the URL for the classify section
    } else {
        // Display an error message if credentials do not match
        document.getElementById('error-message').textContent = "Invalid username or password!";
    }
}


    </script>
</body>
</html>
